# Render Blueprint - Deploy webbetonglammau
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: webbetonglammau
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_BUCKET
        value: uploads