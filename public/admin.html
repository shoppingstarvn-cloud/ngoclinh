<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER ADMIN - Bê Tông Phương Bắc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0f0f1a;font-family:'Segoe UI',sans-serif;color:#fff;overflow-x:hidden}
        #login-screen{position:fixed;top:0;left:0;width:100%;height:100vh;background:linear-gradient(135deg,#0a0a0a,#1a1a2e 50%,#16213e);z-index:99999;display:flex;justify-content:center;align-items:center}
        .login-box{background:rgba(255,255,255,0.05);padding:50px;border-radius:20px;backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);width:420px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,0.5)}
        .login-box h3{color:#ffd700;font-size:28px;margin-bottom:5px}
        .login-box p{color:rgba(255,255,255,0.6);margin-bottom:30px}
        .login-box input{width:100%;padding:16px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:#fff;font-size:16px;outline:none;transition:.3s}
        .login-box input:focus{border-color:#0d6efd;box-shadow:0 0 20px rgba(13,110,253,0.3)}
        .sidebar{width:250px;background:linear-gradient(180deg,#0a0a0a,#16162a);color:#fff;min-height:100vh;position:fixed;z-index:1000;overflow-y:auto;transition:.3s;border-right:1px solid rgba(255,255,255,0.05)}
        .sidebar::-webkit-scrollbar{width:3px}
        .sidebar::-webkit-scrollbar-thumb{background:#0d6efd;border-radius:2px}
        .sidebar .brand{padding:20px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.05)}
        .sidebar .brand h5{color:#ffd700;font-weight:800;margin:0}
        .sidebar .brand small{color:rgba(255,255,255,0.3);font-size:10px;text-transform:uppercase;letter-spacing:2px}
        .nav-section{padding:15px 20px 5px;font-size:10px;text-transform:uppercase;color:rgba(255,255,255,0.2);letter-spacing:2px;font-weight:700}
        .nav-link{color:rgba(255,255,255,0.6);cursor:pointer;padding:10px 20px;display:flex;align-items:center;gap:12px;transition:.3s;border-left:3px solid transparent;font-size:13px;text-decoration:none}
        .nav-link:hover{background:rgba(255,255,255,0.04);color:#fff;padding-left:25px}
        .nav-link.active{background:rgba(13,110,253,0.12);color:#0d6efd;border-left-color:#0d6efd;font-weight:600}
        .nav-link i{width:18px;text-align:center}
        .main-content{margin-left:250px;min-height:100vh;padding:20px}
        .top-bar{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:15px 25px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
        .top-bar h4{margin:0;font-size:18px;font-weight:700}
        .tab-section{display:none;animation:fadeIn .3s}
        .tab-section.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:14px;margin-bottom:20px;overflow:hidden}
        .card-header{background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);padding:16px 20px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
        .card-body{padding:20px}
        .form-control,.form-select{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;padding:10px 14px;outline:none;transition:.3s}
        .form-control:focus,.form-select:focus{border-color:#0d6efd;box-shadow:0 0 0 3px rgba(13,110,253,0.15);background:rgba(255,255,255,0.08);color:#fff}
        .form-select option{background:#16162a;color:#fff}
        textarea.form-control{min-height:80px;resize:vertical}
        .btn{border-radius:8px;font-weight:600;padding:8px 20px;transition:.3s;font-size:13px;border:none}
        .btn:hover{transform:translateY(-1px)}
        .btn-primary{background:linear-gradient(135deg,#0d6efd,#0a58ca); color: #fff;}
        .btn-success{background:linear-gradient(135deg,#198754,#157347); color: #fff;}
        .btn-danger{background:linear-gradient(135deg,#dc3545,#bb2d3b); color: #fff;}
        .btn-warning{background:linear-gradient(135deg,#ffc107,#d39e00);color:#000}
        .btn-sm{padding:5px 12px;font-size:11px}
        .table{color:rgba(255,255,255,0.8);font-size:13px;margin:0}
        .table thead th{background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.4);font-size:11px;text-transform:uppercase;letter-spacing:1px;border:none;padding:10px 12px;font-weight:600}
        .table tbody td{border-color:rgba(255,255,255,0.04);padding:10px 12px;vertical-align:middle; color: #fff;}
        .table tbody tr:hover{background:rgba(255,255,255,0.02)}
        .thumb-img{width:60px;height:40px;object-fit:cover;border-radius:6px;border:1px solid rgba(255,255,255,0.08)}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
        .stat-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;transition:.3s}
        .stat-card:hover{border-color:rgba(255,255,255,0.12);transform:translateY(-2px)}
        .stat-card .num{font-size:24px;font-weight:800;margin:0}
        .stat-card .lbl{color:rgba(255,255,255,0.4);margin:0;font-size:11px;text-transform:uppercase}
        .empty-state{text-align:center;padding:40px;color:rgba(255,255,255,0.3)}
        .empty-state i{font-size:48px;margin-bottom:12px;opacity:0.4}
        .modal-custom{background:rgba(0,0,0,0.7);backdrop-filter:blur(10px)}
        .modal-custom .modal-content{background:#1a1a2e;border:1px solid rgba(255,255,255,0.1);border-radius:16px;color:#fff}
        .modal-custom .modal-header,.modal-custom .modal-footer{border-color:rgba(255,255,255,0.06)}
        .modal-custom .btn-close{filter:invert(1)}
        .badge-dot{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:600}
        @media(max-width:768px){.sidebar{width:50px}.sidebar .brand h5,.sidebar .brand small,.nav-section,.nav-link span{display:none}.nav-link{justify-content:center;padding:12px}.main-content{margin-left:50px;padding:10px}.stats-grid{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <div class="mb-3"><i class="fas fa-crown" style="font-size:60px;color:#ffd700"></i></div>
        <h3>SUPER ADMIN</h3>
        <p>Hệ thống quản trị CMS • API CRUD</p>
        <div style="position:relative;margin-bottom:20px">
            <input type="password" id="login_password" placeholder="Nhập mật khẩu..." onkeydown="if(event.key==='Enter')doLogin()" style="padding-right:45px">
            <i class="fas fa-eye" style="position:absolute;right:16px;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(255,255,255,0.4)" onclick="this.classList.toggle('fa-eye-slash');document.getElementById('login_password').type=document.getElementById('login_password').type==='password'?'text':'password'"></i>
        </div>
        <button class="btn btn-primary w-100 py-3 fw-bold" onclick="doLogin()"><i class="fas fa-rocket"></i> ĐĂNG NHẬP</button>
        <p class="mt-3" style="color:rgba(255,255,255,0.2);font-size:11px">Mật khẩu mặc định: admin / 8386 / cuaau@2026</p>
    </div>
</div>

<div class="wrapper" id="admin-wrapper" style="display:none">
    <nav class="sidebar">
        <div class="brand"><h5><i class="fas fa-crown"></i> ADMIN</h5><small>Bê Tông Phương Bắc</small></div>
        <div class="nav-section">Tổng Quan</div>
        <a class="nav-link active" onclick="showTab('dashboard',this)"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
        
        <div class="nav-section">Nội Dung</div>
        <a class="nav-link" onclick="showTab('categories',this)"><i class="fas fa-sitemap"></i><span>Danh mục</span></a>
        <a class="nav-link" onclick="showTab('posts',this)"><i class="fas fa-newspaper"></i><span>Bài viết</span></a>
        <a class="nav-link" onclick="showTab('products',this)"><i class="fas fa-box"></i><span>Sản phẩm</span></a>
        <a class="nav-link" onclick="showTab('slides',this)"><i class="fas fa-images"></i><span>Slide</span></a>
        
        <div class="nav-section">Hệ Thống</div>
        <a class="nav-link" onclick="logout()" style="color:#dc3545"><i class="fas fa-sign-out-alt"></i><span>Đăng xuất</span></a>
    </nav>

    <div class="main-content">
        <div class="top-bar">
            <h4 id="page-title"><i class="fas fa-tachometer-alt text-primary"></i> Dashboard</h4>
            <div>
                <span class="badge bg-success me-2"><i class="fas fa-circle"></i> <span id="conn-status">LIVE</span></span>
                <span class="badge bg-secondary me-2" id="user-role">SUPERADMIN</span>
                <button class="btn btn-primary btn-sm" onclick="loadAllData()"><i class="fas fa-sync"></i> Tải lại</button>
            </div>
        </div>

        <div id="tab-dashboard" class="tab-section active">
            <div class="stats-grid" id="stats-grid"></div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <div class="card"><div class="card-header"><i class="fas fa-bolt text-warning"></i> Hành động nhanh</div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button class="btn btn-info" onclick="showAddForm('categories')"><i class="fas fa-sitemap"></i> Thêm Danh mục</button>
                            <button class="btn btn-primary" onclick="showAddForm('posts')"><i class="fas fa-newspaper"></i> Thêm Bài viết</button>
                            <button class="btn btn-success" onclick="showAddForm('products')"><i class="fas fa-box"></i> Thêm Sản phẩm</button>
                        </div>
                    </div></div>
                </div>
            </div>
        </div>

        <div id="dynamic-tabs-container"></div>
    </div>
</div>

<script>
// ======================== CONFIG ========================
const SUPABASE_URL = "https://bfruxinvvvaqufghtigw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QUYv4qEJntioJJ-XWtHkdA_haHovSml";
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let authToken = null;
let allData = {};
let currentTable = null;

// ======================== CMS TABLES ========================
// Cấu trúc chuẩn để tự động sinh Form thêm, sửa, xóa
const TABLES = [
    { name: 'categories', label: 'Danh mục', icon: 'sitemap', pk: 'id',
      fields: [
          { key: 'name', label: 'Tên danh mục', type: 'text', required: true },
          { key: 'slug', label: 'Đường dẫn (Slug)', type: 'text', required: true },
          { key: 'description', label: 'Mô tả', type: 'textarea' },
          { key: 'is_active', label: 'Kích hoạt', type: 'checkbox' }
      ],
      cols: [
          { key: 'id', label: 'ID' },
          { key: 'name', label: 'Tên Danh Mục' },
          { key: 'slug', label: 'Slug' },
          { key: 'is_active', label: 'Active', render: v => v ? '<span class="text-success">✓</span>' : '<span class="text-danger">✗</span>' }
      ]
    },
    { name: 'posts', label: 'Bài viết', icon: 'newspaper', pk: 'id',
      fields: [
          { key: 'title', label: 'Tiêu đề', type: 'text', required: true },
          { key: 'category_id', label: 'ID Danh mục', type: 'number' },
          { key: 'thumbnail_url', label: 'URL Ảnh đại diện', type: 'text' },
          { key: 'content', label: 'Nội dung (Trình soạn thảo)', type: 'richtext' },
          { key: 'is_active', label: 'Kích hoạt', type: 'checkbox' }
      ],
      cols: [
          { key: 'id', label: 'ID' },
          { key: 'thumbnail_url', label: 'Ảnh', render: v => v ? `<img src="${v}" class="thumb-img">` : '' },
          { key: 'title', label: 'Tiêu đề' },
          { key: 'is_active', label: 'Active', render: v => v ? '<span class="text-success">✓</span>' : '<span class="text-danger">✗</span>' }
      ]
    },
    { name: 'products', label: 'Sản phẩm', icon: 'box', pk: 'id',
      fields: [
          { key: 'name', label: 'Tên sản phẩm', type: 'text', required: true },
          { key: 'price', label: 'Giá (VNĐ)', type: 'text' },
          { key: 'content', label: 'Mô tả chi tiết', type: 'richtext' },
          { key: 'thumbnail_url', label: 'URL Ảnh sản phẩm', type: 'text' }
      ],
      cols: [
          { key: 'id', label: 'ID' },
          { key: 'thumbnail_url', label: 'Ảnh', render: v => v ? `<img src="${v}" class="thumb-img">` : '' },
          { key: 'name', label: 'Tên SP' },
          { key: 'price', label: 'Giá' }
      ]
    },
    { name: 'slides', label: 'Slide', icon: 'images', pk: 'id',
      fields: [
          { key: 'title', label: 'Tiêu đề', type: 'text' },
          { key: 'image_url', label: 'Upload Hình ảnh', type: 'image', required: true }
      ],
      cols: [
          { key: 'id', label: 'ID' },
          { key: 'image_url', label: 'Ảnh', render: v => v ? `<img src="${v}" class="thumb-img">` : '' },
          { key: 'title', label: 'Tiêu đề' }
      ]
    }
];

// Khởi tạo HTML cho các bảng quản lý
function initDynamicTabs() {
    const container = document.getElementById('dynamic-tabs-container');
    TABLES.forEach(t => {
        container.innerHTML += `
        <div id="tab-${t.name}" class="tab-section">
            <div class="card">
                <div class="card-header"><i class="fas fa-${t.icon} text-primary"></i> Quản lý ${t.label}</div>
                <div class="card-body">
                    <button class="btn btn-primary btn-sm mb-3" onclick="showAddForm('${t.name}')"><i class="fas fa-plus"></i> Thêm mới</button>
                    <div class="table-responsive">
                        <table class="table">
                            <thead><tr>${t.cols.map(c => `<th>${c.label}</th>`).join('')}<th>Thao tác</th></tr></thead>
                            <tbody id="tbody-${t.name}"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="modal fade modal-custom" id="modal-${t.name}">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modalTitle-${t.name}">Thêm mới</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body" id="modalBody-${t.name}"></div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button class="btn btn-primary" onclick="saveRecord('${t.name}')">Lưu Dữ Liệu</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>`;
    });
}

// ======================== LOGIN ========================
async function doLogin() {
    const pwd = document.getElementById('login_password').value;
    if (!pwd) { Swal.fire({icon:'warning',title:'Nhập mật khẩu!',background:'#1a1a2e',color:'#fff'}); return; }
    
    // Check mật khẩu cứng hoặc gọi API
    if (pwd === 'admin' || pwd === '8386' || pwd === 'cuaau@2026') {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('admin-wrapper').style.display = 'block';
        Swal.fire({icon:'success',title:'Chào mừng Giám Đốc!',timer:1500,showConfirmButton:false,background:'#1a1a2e',color:'#fff'});
        loadAllData();
    } else {
        Swal.fire({icon:'error',title:'Sai mật khẩu!',background:'#1a1a2e',color:'#fff'});
    }
}

// ======================== TAB NAVIGATION ========================
function showTab(table, el) {
    document.querySelectorAll('.tab-section').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
    const targetTab = document.getElementById('tab-' + table);
    if(targetTab) targetTab.classList.add('active');
    if (el) el.classList.add('active');
    
    const t = TABLES.find(x => x.name === table);
    document.getElementById('page-title').innerHTML = `<i class="fas fa-${t ? t.icon : 'tachometer-alt'} text-primary"></i> ${t ? t.label : 'Dashboard'}`;
    currentTable = table;
    if(table !== 'dashboard') renderTable(table);
}

// ======================== LOAD DATA ========================
async function loadAllData() {
    allData = {};
    for (const t of TABLES) {
        try {
            const { data } = await _supabase.from(t.name).select('*').order('id', { ascending: false }).limit(500);
            allData[t.name] = data || [];
        } catch(e) { allData[t.name] = []; }
    }
    updateStats();
    if (currentTable && currentTable !== 'dashboard') renderTable(currentTable);
}

function updateStats() {
    const grid = document.getElementById('stats-grid');
    grid.innerHTML = TABLES.map(t => {
        const count = (allData[t.name] || []).length;
        return `<div class="stat-card" style="cursor:pointer" onclick="showTab('${t.name}')">
            <div style="font-size:24px;margin-bottom:5px;color:#0d6efd"><i class="fas fa-${t.icon}"></i></div>
            <p class="num">${count}</p>
            <p class="lbl">${t.label}</p>
        </div>`;
    }).join('');
}

// ======================== RENDER TABLE ========================
function renderTable(table) {
    const t = TABLES.find(x => x.name === table);
    const data = allData[table] || [];
    const tbody = document.getElementById(`tbody-${table}`);
    if (!tbody) return;
    
    if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="99" class="text-center py-4 text-muted">Chưa có dữ liệu</td></tr>`;
        return;
    }
    
    tbody.innerHTML = data.map(row => {
        let cols = t.cols.map(c => {
            if (c.render) return `<td>${c.render(row[c.key])}</td>`;
            const val = row[c.key];
            if (c.key === 'id') return `<td class="text-muted">#${val}</td>`;
            if (typeof val === 'string' && val.length > 50) return `<td>${val.substring(0, 50)}...</td>`;
            return `<td>${val || ''}</td>`;
        }).join('');
        
        return `<tr>
            ${cols}
            <td style="white-space:nowrap">
                <button class="btn btn-primary btn-sm me-1" onclick="editRecord('${table}', ${row.id})"><i class="fas fa-edit"></i> Sửa</button>
                <button class="btn btn-danger btn-sm" onclick="deleteRecord('${table}', ${row.id})"><i class="fas fa-trash"></i> Xóa</button>
            </td>
        </tr>`;
    }).join('');
}

// ======================== SHOW FORM (ADD / EDIT) ========================
let quillInstances = {};
function showAddForm(table, editId = null) {
    const t = TABLES.find(x => x.name === table);
    if (!t) return;
    
    const isEdit = editId !== null;
    const itemData = isEdit ? allData[table].find(x => x.id === editId) : {};
    
    document.getElementById(`modalTitle-${table}`).textContent = isEdit ? `Sửa ${t.label}` : `Thêm mới ${t.label}`;
    const body = document.getElementById(`modalBody-${table}`);
    
    body.innerHTML = `<input type="hidden" id="editId-${table}" value="${editId || ''}">` +
        t.fields.map(f => {
            const id = `f-${table}-${f.key}`;
            let val = isEdit && itemData[f.key] !== undefined ? itemData[f.key] : '';
            let input = '';
            
            if (f.type === 'richtext') {
                input = `<div id="q-${id}" style="background:#fff;color:#111;min-height:200px;border-radius:6px"></div>`;
            } else if (f.type === 'image') {
                input = `<input type="file" accept="image/*" class="form-control" id="${id}">
                         ${val ? `<img src="${val}" class="mt-2" height="60" style="border-radius:5px">` : ''}`;
            } else if (f.type === 'textarea') {
                input = `<textarea class="form-control" id="${id}">${val}</textarea>`;
            } else if (f.type === 'checkbox') {
                input = `<input type="checkbox" class="form-check-input" id="${id}" style="width:20px;height:20px" ${val ? 'checked' : ''}>`;
            } else if (f.type === 'number') {
                input = `<input type="number" class="form-control" id="${id}" value="${val || 0}">`;
            } else {
                input = `<input class="form-control" id="${id}" value="${val}">`;
            }
            return `<div class="mb-3"><label class="form-label text-warning fw-bold">${f.label}</label>${input}</div>`;
        }).join('');
    
    new bootstrap.Modal(document.getElementById(`modal-${table}`)).show();
    
    // Init Quill Editor
    t.fields.forEach(f => {
        if (f.type === 'richtext') {
            const cont = document.getElementById(`q-f-${table}-${f.key}`);
            const q = new Quill(cont, { theme: 'snow', modules: { toolbar: [['bold','italic','underline'],[{header:[1,2,3,false]}],['link','image'],['clean']] } });
            if (isEdit && itemData[f.key]) q.root.innerHTML = itemData[f.key];
            quillInstances[`f-${table}-${f.key}`] = q;
        }
    });
}

function editRecord(table, id) {
    showAddForm(table, id);
}

// ======================== SAVE DATA ========================
async function saveRecord(table) {
    const t = TABLES.find(x => x.name === table);
    const editId = document.getElementById(`editId-${table}`).value;
    const dataToSave = {};
    
    Swal.fire({title:'Đang xử lý...',allowOutsideClick:false,didOpen:()=>Swal.showLoading(),background:'#1a1a2e',color:'#fff'});
    
    for (const f of t.fields) {
        if (f.type === 'richtext') {
            dataToSave[f.key] = quillInstances[`f-${table}-${f.key}`]?.root.innerHTML || '';
        } else if (f.type === 'checkbox') {
            dataToSave[f.key] = document.getElementById(`f-${table}-${f.key}`).checked;
        } else if (f.type !== 'image') {
            dataToSave[f.key] = document.getElementById(`f-${table}-${f.key}`).value;
        }
    }
    
    try {
        if (editId) {
            await _supabase.from(table).update(dataToSave).eq('id', editId);
        } else {
            await _supabase.from(table).insert([dataToSave]);
        }
        Swal.fire({icon:'success',title:'Thành công!',timer:1500,showConfirmButton:false,background:'#1a1a2e',color:'#fff'});
        bootstrap.Modal.getInstance(document.getElementById(`modal-${table}`)).hide();
        loadAllData();
    } catch(e) {
        Swal.fire('Lỗi!', 'Không thể lưu dữ liệu.', 'error');
    }
}

// ======================== DELETE DATA ========================
async function deleteRecord(table, id) {
    Swal.fire({
        title: 'Anh có chắc chắn muốn xóa?',
        text: "Dữ liệu đã xóa không thể khôi phục lại được đâu ạ!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Đồng ý xóa',
        cancelButtonText: 'Hủy',
        background:'#1a1a2e',color:'#fff'
    }).then(async (result) => {
        if (result.isConfirmed) {
            try {
                await _supabase.from(table).delete().eq('id', id);
                Swal.fire({icon:'success',title:'Đã xóa xong!',timer:1500,showConfirmButton:false,background:'#1a1a2e',color:'#fff'});
                loadAllData();
            } catch(e) {
                Swal.fire('Lỗi!', 'Hệ thống từ chối xóa.', 'error');
            }
        }
    });
}

function logout() { location.reload(); }

window.onload = () => {
    initDynamicTabs();
};
